<style>
    #tetrap-client-area {
        font-family: sans-serif;
        z-index: 10000000;
        position: fixed;
        right: 0px;
        width: 650px;
        max-width: 60vw;
        max-height: 60vh;
        margin: 2px;
        background-color: var(--ap-bg);
        color: var(--ap-text);
        transition: opacity 0.3s ease-out;

        --ap-text: #000;
        --ap-bg: #fff;
        --ap-bg-darker: #ddd;
        --ap-header: #b1aaa4;
        --ap-nav: #d3cec5;
        --ap-bad: #b00;

        --ap-disabled: #777;
        --ap-disabled-bg: #aaa;
    }

    #tetrap-client-area.dark {
        --ap-text: #eee;
        --ap-bg: #333;
        --ap-bg-darker: #111;
        --ap-header: #363533;
        --ap-nav: #3f3c39;
        --ap-bad: #f88;

        --ap-disabled: #aaa;
        --ap-disabled-bg: #555;
    }

    .ap-connected #tetrap-client-area {
        --ap-header: #99f;
        --ap-nav: #bbf;
    }
    .ap-connected #tetrap-client-area.dark {
        --ap-header: #39397a;
        --ap-nav: #447;
    }

    .ap-hintmode #tetrap-client-area {
        --ap-header: #6fafc9;
        --ap-nav: #96c9dd;
    }
    .ap-hintmode #tetrap-client-area.dark {
        --ap-header: #264c5b;
        --ap-nav: #224451;
    }

    #tetrap-client-area input, 
    #tetrap-client-area button:not(.header-button) {
        border: 1px solid var(--ap-disabled);
        border-radius: 2px;
        padding: 2px;
        background-color: var(--ap-bg);
        color: var(--ap-text);
    }
    #tetrap-client-area input:disabled {
        background-color: var(--ap-disabled-bg);
        color: var(--ap-disabled);
    }
    
    #tetrap-client-area input[type="submit"],
    #tetrap-client-area button:not(.header-button) {
        padding: 2px 6px;
    }
    #tetrap-client-area input[type="submit"]:hover, 
    #tetrap-client-area button:not(.header-button):hover {
        background-color: rgb(from var(--ap-bg-darker) r g b / 0.7);
    }
    #tetrap-client-area input[type="submit"]:active, 
    #tetrap-client-area button:not(.header-button):active {
        background-color: var(--ap-bg-darker);
    }

    #tetrap-client-area input[type="submit"]:disabled, 
    #tetrap-client-area button:not(.header-button):disabled {
        background-color: var(--ap-disabled-bg);
        color: var(--ap-disabled);
    }

    #ap-connect-form br {
        margin: 4px 0px;
    }
    #ap-connect-error {
        color: var(--ap-bad);
        margin: 8px 0px;
    }
    #ap-connect-error:empty {
        display: none;
    }

    #tetrap-client-area.after-menu-load {
        top: 4.2em;
        z-index: 999999; /* below the fade-out but above everything else */
    }

    .ap-tab {
        margin: 4px;
    }
    .ap-tab.disabled {
        display: none;
    }

    #ap-chat-messages {
        border: 1px solid var(--ap-text);
        background-color: var(--ap-bg-darker);
        width: calc(100%-8px);
        height: 200px;
        overflow: auto;
        padding: 3px;
    }
    .ap-message {
        padding: 2px;
        margin: 0px;
        white-space: pre-wrap;
    }
    .ap-item-message {
        font-weight: bold;
    }
    .ap-location-message {
        color: rgb(115, 192, 95);
    }
    .ap-player-message {
        color: rgb(73, 157, 253);
    }

    #ap-chat-input {
        width: 100%;
        box-sizing: border-box;
    }
    
    header.tetrap {
        display: flex;
        background-color: var(--ap-header);
        padding: 2px;
        align-items: center;
        transition: background-color 0.3s ease-out;
    }

    #ap-nav {
        display: flex;
        background-color: var(--ap-nav);
        margin-bottom: 2px;
        border-top: 1px solid var(--ap-text);
        transition: background-color 0.3s ease-out;
    }

    .ap-tab-button {
        padding: 0px 6px;
        border-right: 1px solid var(--ap-text);
        border-bottom: 1px solid var(--ap-text);
        background-color: #7773;
        transition: padding 0.2s, background 0.2s;

        user-select: none;
        -webkit-user-select: none; /* thank you safari */
        cursor: pointer;
    }
    .ap-tab-button.active {
        background-image: linear-gradient(var(--ap-nav), var(--ap-bg));
        padding: 0px 16px;
        border-bottom: none;
    }

    .ap-tab-button:hover {
        background-color: rgb(from var(--ap-bg) r g b / 0.2);
    }

    #ap-nav.disabled .ap-tab-button:not(.active) {
        color: var(--ap-disabled);
        background-color: var(--ap-disabled-bg);
        cursor: not-allowed;
    }

    .ap-tab-filler {
        flex-grow: 1;
        border-bottom: 1px solid var(--ap-text);
    }

    p.tetrap {
        margin: 0px 4px;
        font-weight: bold;
    }
    #ap-status {
        margin-left: auto;
        font-size: smaller;
        font-weight: normal;
    }
    #ap-username {
        font-size: smaller;
    }
    #ap-username:empty {
        display: none;
    }

    #ap-dark-toggle {
        padding: 0px 4px;
        margin-left: 4px;
    }
    #ap-dark-toggle svg {
        width: 10px;
        height: 10px;
        transition: rotate 0.5s ease-out, fill 0.3s;
        fill: var(--ap-text);
    }
    #tetrap-client-area.dark #ap-dark-toggle svg {
        rotate: 900deg;
    }

    #ap-collapse, #ap-dark-toggle {
        border: none;
        background-color: rgb(from var(--ap-text) r g b / 0.1);
        cursor: pointer;
    }
    #ap-collapse:hover, #ap-dark-toggle:hover {
        background-color: rgb(from var(--ap-text) r g b / 0.2);
    }

    #tetrap-client-area.collapsed {
        width: auto;
        height: auto;
        opacity: 0.3;
    }
    #tetrap-client-area.collapsed:hover {
        opacity: 1;
    }
    #tetrap-client-area.collapsed .ap-tab {
        display: none;
    }
    #tetrap-client-area.collapsed #ap-status {
        display: none;
    }
    #tetrap-client-area.collapsed #ap-username {
        display: none;
    }
    #tetrap-client-area.collapsed #ap-dark-toggle {
        display: none;
    }
    #tetrap-client-area.collapsed nav {
        display: none;
    }

    #ap-shortstatus {
        display: none;
    }
    #tetrap-client-area.collapsed #ap-shortstatus {
        display: block;
        margin: 2px;
    }
    
    #ap-progress-area {
        max-height: 300px;
        overflow-y: scroll;
    }
    #ap-counter-area {
        margin: 0px;
        position: sticky;
        top: 0px;
        background-color: rgb(from var(--ap-bg) r g b / 0.7);
    }
    #ap-ach-count, #ap-hint-score {
        font-size: 24px;
        font-weight: bold;
        font-family: HUN;
    }
    #ap-req-count, #ap-hint-req {
        font-family: HUN;
    }

    .ap-modset {
        display: flex;
        align-items: center;
        padding: 4px 0px;
    }
    .ap-modset:nth-child(even) {
        background-color: var(--ap-bg-darker);
    }
    .ap-modset p, .ap-mod-hint {
        width: 20%;
        margin: 0;
    }
    .ap-modset img, .ap-modset div {
        width: 32px;
        height: 32px;
        margin-right: 2px;
    }
    #tetrap-client-area.dark img[src="/res/achievements/frames/none.png"] {
        filter: invert(1);
    }

    #ap-progress-tip {
        display: flex;
        align-items: center;
        color: var(--ap-disabled);
    }
    #ap-progress-tip p {
        margin: 0;
    }
    .ap-floor-tip {
        text-align: center;
        width: 32px;
        margin-right: 2px !important;
    }

    
    #ap-hintmode-earned {
        margin: 0px;
        text-align: center;
    }

    #ap-hint-req-changer {
        margin-top: 8px;
        font-size: smaller;
    }
    #ap-hint-req-input {
        width: 4em;
    }

    #ap-hintmode-stats {
        position: absolute;
        right: 0px;
        width: 30%;
        margin: 4px;
        text-align: center;
        overflow-y: scroll;
        height: calc(100% - 59px);
        border: 1px solid var(--ap-text);
        background-color: var(--ap-bg-darker);
        transition: width 0.4s ease;
    }
    #ap-hintmode-stats.adding {
        width: 70%;
    }

    #ap-hint-last {
        margin-top: 8px;
        color: var(--ap-disabled);
        font-size: small;
        transition: transform 0.3s ease-out, opacity 0.3s ease-out, margin-top 0.3s ease-out;
    }
    #ap-hintmode-stats.adding #ap-hint-last {
        transform: translateY(-1.5rem);
        opacity: 0;
        margin-top: 0px;
    }

    #ap-hint-gained {
        font-size: 26px;
        font-family: HUN;
        padding: 4px;
        transition: background-color 0.3s ease-out;
    }
    #ap-hintmode-stats.adding #ap-hint-gained {
        position: sticky;
        top: 10px;
        background-color: rgb(from var(--ap-bg-darker) r g b / 0.7);
        z-index: 1;
    }
    #ap-hint-gained.animating {
        animation: hm-score-boost 0.6s ease-out;
    }

    @keyframes hm-score-boost {
        0% {
            transform: scale(1) translateY(0);
        }
        10% {
            transform: scale(1.2) translateY(-0.5rem);
        }
        100% {
            transform: scale(1) translateY(0);
        }
    }

    #ap-hint-bonuses {
        margin-top: 4px;
        transition: opacity 0.3s ease-out;
    }

    .ap-hintmode-bonus {
        margin-top: 6px;
    }
    #ap-hintmode-stats.adding .ap-hintmode-bonus {
        animation: hm-fadein 0.3s ease-out forwards, hm-color-fadeout 0.3s ease-out 0.8s forwards;
    }
    @keyframes hm-fadein {
        from {
            opacity: 0;
            background-color: rgb(from var(--ap-nav) r g b / 0);
            transform: translateY(1rem) scale(0.9);
        }
        to {
            opacity: 1;
            background-color: var(--ap-nav);
            transform: translateY(0) scale(1);
        }
    }
    @keyframes hm-color-fadeout {
        from {
            background-color: var(--ap-nav);
        }
        to {
            background-color: rgb(from var(--ap-nav) r g b / 0);
        }
    }

    #ap-hint-bonuses .bonus-name {
        font-size: 14px;
    }
    #ap-hint-bonuses .bonus-value {
        font-family: HUN;
    }
    #ap-hint-bonuses .bonus-quiet {
        color: var(--ap-disabled);
        font-size: 12px;
    }

    #ap-hint-fadeout {
        position: sticky;
        bottom: 0px;
        height: 20px;
        background-image: linear-gradient(rgb(from var(--ap-bg-darker) r g b / 0), var(--ap-bg-darker));
    }

    #ap-hint-shop {
        width: calc(70% - 8px);
    }

    .ap-hint-shop-item {
        margin: 4px 0px;
    }
    .ap-quiet {
        font-size: small;
        color: var(--ap-disabled);
    }
    .ap-hint-price {
        font-family: HUN;
    }
    #ap-buy-hint {
        font-size: larger;
    }

    
    .chatfocus.chatbg.tetrap-chatfocus #ingame_chat_container {
        background: none !important;
    }

    #zenithmenu.reversed #ap-hintmode-mult-solo {
        transform: translateY(0);
        opacity: 1;
    }
    .ap-mod-mult span {
        color: #ff9c6b !important;
    }
    .ap-mod-mult {
        display: none;
    }
    body.ap-hintmode .ap-mod-mult {
        display: block;
        margin-top: 0.5vw !important;
    }

    body.ap-hintmode #start_zenith.nomods h1 {
        transform: translateY(1.2rem);
    }
</style>

<header class="tetrap">
    <button id="ap-collapse" class="header-button">▶</button>
    <p class="tetrap">TETR.AP</p>
    <p class="tetrap" id="ap-status"></p>
    <p class="tetrap" id="ap-username"></p>
    <button id="ap-dark-toggle" class="header-button">
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <!--!Font Awesome Free v7.3.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
            <path d="M448 256c0-106-86-192-192-192l0 384c106 0 192-86 192-192zM0 256a256 256 0 1 1 512 0 256 256 0 1 1 -512 0z"></path>
        </svg>
    </button>
</header>
<p id="ap-shortstatus">Not connected</p>

<nav id="ap-nav" class="tetrap disabled">
    <!-- auto-populated by script -->
</nav>

<div id="ap-connect-area" class="ap-tab" data-tab-name="connect">
    <form id="ap-connect-form">
        <label for="ap-server">Server:</label>
        <input id="ap-server" type="text" placeholder="archipelago.gg:12345" required>
        <br>
        <label for="ap-slot">Slot Name:</label>
        <input id="ap-slot" type="text" required>
        <br>
        <label for="ap-password">Password (opt):</label>
        <input id="ap-password" type="text">
        <br>
        <label for="ap-hintmode">Hint Mode:</label>
        <input id="ap-hintmode" type="checkbox">
        <br>
        <input id="ap-connect" type="submit" value="Connect">
    </form>
    <p id="ap-connect-error"></p>
</div>

<div id="ap-chat-area" class="ap-tab disabled" data-tab-name="chat">
    <div id="ap-chat-messages"></div>
    <input id="ap-chat-input" type="text" placeholder="type a message, press enter to send..." autocomplete="off">
    </div>
</div>
<div id="ap-progress-area" class="ap-tab disabled" data-tab-name="progress">
    <div id="ap-progress-standard">
        <p id="ap-counter-area">You currently have <span id="ap-ach-count">0</span>/<span id="ap-req-count">Y</span> Achievements required to goal.</p>
        <div id="ap-progress-tip">
            <p class="ap-mod-tip">Modset</p>
            <p class="ap-floor-tip">f2</p>
            <p class="ap-floor-tip">f3</p>
            <p class="ap-floor-tip">f4</p>
            <p class="ap-floor-tip">f5</p>
            <p class="ap-floor-tip">f6</p>
            <p class="ap-floor-tip">f7</p>
            <p class="ap-floor-tip">f8</p>
            <p class="ap-floor-tip">f9</p>
            <p class="ap-floor-tip">f10</p>
        </div>
        <div id="ap-modset-list"></div>
    </div>
    <div id="ap-progress-hintmode" style="display: none;">
        <div id="ap-hintmode-stats">
            <div id="ap-hint-last">Last run</div>
            <div id="ap-hint-gained">N/A</div>
            <div id="ap-hint-bonuses">
                <div class="bonus-quiet">You haven't completed a run yet this session!</div>
            </div>
            <div id="ap-hint-fadeout"></div>
        </div>
        <div id="ap-hint-shop">
            <p id="ap-hintmode-earned">You have <span id="ap-hint-score">0</span> Hint Score</p>

            <div id="ap-hint-shop-form">
                <div class="ap-hint-shop-item">
                    <input id="ap-hint-new-only" type="checkbox">
                    <label for="ap-hint-new-only">Guarantee new hint <span class="ap-hint-price" id="ap-hint-new-price">[X1.00]</span></label>
                    <div class="ap-quiet">The price of this increases depending on how many hints are known</div>
                </div>
                <div class="ap-hint-shop-item">
                    <input id="ap-hint-no-traps" type="checkbox">
                    <label for="ap-hint-no-traps">No trap items <span class="ap-hint-price">[X1.20]</span></label>
                </div>
                <div class="ap-hint-shop-item">
                    <input id="ap-hint-no-filler" type="checkbox">
                    <label for="ap-hint-no-filler">No filler items <span class="ap-hint-price">[X1.80]</span></label>
                </div>
                <div class="ap-hint-shop-item">
                    <input id="ap-hint-no-useful" type="checkbox">
                    <label for="ap-hint-no-useful">No useful items <span class="ap-hint-price">[X1.10]</span></label>
                </div>
                <button id="ap-buy-hint">
                    Buy Hint (<span class="ap-hint-price" id="ap-hint-total-price">1000.0</span>)
                </button>
            </div>
            
            <br>
            <form id="ap-hint-req-changer">
                <label for="ap-hint-req-input">Enter the height you reach on average for unmodded runs to adjust the Hint Score prices:</label>
                <input id="ap-hint-req-input" type="number" min="50" value="1000">
                <input type="submit" value="Set">
            </form>
        </div>
    </div>
</div>
